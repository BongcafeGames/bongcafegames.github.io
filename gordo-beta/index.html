const ITEM={
 coal:{n:'석탄',e:'⚫'},iron:{n:'철',e:'⚙️'},sulfur:{n:'유황',e:'🟡'},copper:{n:'구리',e:'🟠'},

 /* 원석은 못 팖(사용자). 판매가(npc)는 전부 사용자가 준 값(1.0.1). 금 주괴 피버 4만 */
